<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Under Development</title>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/geist-font/1.0.0/geist-mono.css');

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .scribble-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .scribble-wrap img {
            max-width: 60vw;
            max-height: 60vh;
            transform: rotate(-5deg);
        }

        .footer-text {
            font-family: 'Geist Mono', monospace;
            font-size: 14px;
            letter-spacing: 0.05em;
            color: #888888;
            margin-bottom: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="scribble-wrap">
        <img src="scribbles.svg" alt="Scribble">
    </div>

    <div class="footer-text">THIS PAGE IS CURRENTLY UNDER DEVELOPMENT</div>

</body>

</html>
